name: Sync contribution status

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

permissions:
  contents: write

concurrency:
  group: sync-contribution-status
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test

      - run: npm run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm run check

      - name: Commit lifecycle changes
        run: |
          if git diff --quiet -- README.md data/contributions.json; then
            echo "No tracked lifecycle changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md data/contributions.json
          git commit -m "chore: sync contribution status"
          git push origin HEAD:main
